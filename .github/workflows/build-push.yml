name: Build and Push embedding-bench-gpu

on:
  push:
    branches: [main]
    paths:
      - "deploy/Dockerfile.runpod"
      - "deploy/requirements-mteb.txt"
      - "bench/**"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/seongwonm/embedding-bench-gpu

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.runpod
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:latest
